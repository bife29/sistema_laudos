[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-laudos-backend"
version = "0.1.0"
description = "Sistema de Laudos EEG com IA"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",          # SQLite async (dev)
    # "asyncpg>=0.29.0",           # PostgreSQL async (prod — descomente)

    # Config
    "pydantic-settings>=2.2.0",
    "pydantic[email]>=2.7.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",

    # LLM providers
    "anthropic>=0.39.0",
    # "openai>=1.50.0",            # Descomente se usar OpenAI
    # "httpx>=0.27.0",             # Para Ollama

    # EEG / ML
    "edfio>=0.4.0",
    "numpy>=1.25.0",
    "scipy>=1.11.0",

    # RAG / PDF
    "pypdf>=4.0.0",
    "httpx>=0.27.0",

    # Storage
    # "boto3>=1.34.0",             # Descomente para S3/MinIO
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
prod = [
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
    "gunicorn>=22.0.0",
]
